description='''
Physical waves. The water surface rises and falls in a swell that follows the weather (calm, rain, storm) and, in caves with no sky,
a slow cycle of its own. Big waves on open water, ripples on ponds; waves grow and break as the water shallows. Boats ride and tilt,
swimmers and items are lifted and carried, and surf runs up the beach.
'''
